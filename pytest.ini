[pytest]
# 固定收集范围：只收 tests/。
# 原因：scripts/blind_test.py 命中 pytest 默认 `*_test.py` 模式被 import，
# 其 L28 `os.environ.setdefault("TC_OFFLINE", "1")` 在收集期污染全局环境，
# 导致 tests/test_llm_summarizer.py 6 个测试走 offline-placeholder 分支失败。
# 该文件本身 0 个测试函数，属误收集。
testpaths = tests

# 保持默认命名约定，但显式声明，避免后续工具链差异
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 减少噪声
addopts = -ra
